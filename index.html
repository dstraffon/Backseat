<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0614">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Backseat — riddles, trivia, puzzles and car games for road trips.">
  <title>Backseat — road trip games</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Animated WebGL background (see js/shader.js) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="app">
    <header class="topbar" id="topbar" hidden>
      <button class="back" id="back" aria-label="Back">
        <svg viewBox="0 0 24 24" class="icon"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="screen-title"></h2>
    </header>

    <!-- Each screen is drawn in here by js/app.js -->
    <main id="view" class="view"></main>
  </div>

  <!-- Plain scripts (not modules) so the app works by double-clicking index.html -->
  <script src="js/data.js"></script>
  <script src="js/shader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
